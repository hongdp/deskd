name: Release

# Publishes PyPI artifacts and a multi-architecture GHCR image when a GitHub
# Release is published. PyPI uses Trusted Publishing (OIDC): no API token is
# stored; GHCR uses the release job's short-lived repository token.

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[web,tui]" pytest httpx httpx2
      - name: Require the release tag to match the package version
        run: |
          package_version="$(python -c 'from deskd import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-release.lock
      - name: Build and inspect reproducible Python artifacts
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          python -m venv /tmp/deskd-wheel-smoke
          /tmp/deskd-wheel-smoke/bin/python -m pip install --require-hashes -r requirements-container.lock
          /tmp/deskd-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          test "$(/tmp/deskd-wheel-smoke/bin/deskd --version)" = "deskd ${GITHUB_REF_NAME#v}"
          sha256sum dist/* > release-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            release-SHA256SUMS

  publish:
    needs: [build, publish-container]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deskd/
    permissions:
      id-token: write   # OIDC — this is the whole credential
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: .
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Reject mutable convenience tags
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          ! printf '%s\n' "${TAGS}" | grep -Eq ':(latest|[0-9]+\.[0-9]+)$'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both published architectures before PyPI can publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          expected="deskd ${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${image}"
          test "$(docker run --rm --platform linux/amd64 --entrypoint deskd "${image}" --version)" = "${expected}"
          test "$(docker run --rm --platform linux/arm64 --entrypoint deskd "${image}" --version)" = "${expected}"
