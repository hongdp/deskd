name: Gateway Linux UID boundary

# Privileged mock acceptance belongs on a disposable GitHub-hosted VM. Never
# change this job to a self-hosted runner or pull_request_target: it executes
# the proposed test code as root, without repository credentials or secrets.
on:
  push:
    branches: [main]
    paths:
      - "src/deskd/**"
      - "tests/test_gateway_linux_ids.py"
      - "pyproject.toml"
      - ".github/workflows/gateway-boundary.yml"
  pull_request:
    paths:
      - "src/deskd/**"
      - "tests/test_gateway_linux_ids.py"
      - "pyproject.toml"
      - ".github/workflows/gateway-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-uid-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies without installing a service
        run: python -m pip install pytest "cryptography>=41"
      - name: Exercise real peer credentials and filesystem permissions
        shell: bash
        run: |
          set -euo pipefail
          python_executable="$(python -c 'import sys; print(sys.executable)')"
          sudo env -i \
            PATH=/usr/bin:/bin \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            /bin/bash --noprofile --norc -s -- "$python_executable" "$GITHUB_WORKSPACE" <<'ROOT_SCRIPT'
          set -euo pipefail
          umask 077
          python_executable="$1"
          workspace="$2"

          # mktemp creates a new root-owned directory; it cannot reuse an
          # existing path or symlink. Short names leave room for Unix sockets.
          boundary_root="$(mktemp -d /run/deskd-gw.XXXXXXXX)"
          chmod 0755 "$boundary_root"
          mkdir "$boundary_root/scratchpad" "$boundary_root/scratchpad/home"
          chmod 0755 "$boundary_root/scratchpad"
          export HOME="$boundary_root/scratchpad/home"
          export TMPDIR="$boundary_root/scratchpad"
          export DESKD_UID_TEST_ROOT="$boundary_root/scratchpad"

          # All state stays in the new scratchpad. The test cleans its own
          # children; the disposable VM removes this tree on job teardown.
          # Do not add account changes, service installs, or recursive root
          # cleanup. No model, broker, network sandbox, or role-shell claim
          # follows from this peer-credential and DAC acceptance test.
          cd "$workspace"
          "$python_executable" -m pytest \
            -o addopts='' -p no:cacheprovider \
            --basetemp="$TMPDIR/pytest" \
            --junitxml="$TMPDIR/results.xml" \
            tests/test_gateway_linux_ids.py -q

          # A non-root developer run intentionally skips this test. This
          # privileged acceptance job must not turn a skip into a green check.
          "$python_executable" - "$TMPDIR/results.xml" <<'VERIFY_RESULTS'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          if not cases or any(
              case.find(tag) is not None
              for case in cases
              for tag in ("skipped", "failure", "error")
          ):
              raise SystemExit("Linux UID acceptance requires executed, passing tests and zero skips")
          print(f"Executed {len(cases)} Linux UID boundary test(s); zero skipped.")
          VERIFY_RESULTS
          ROOT_SCRIPT
