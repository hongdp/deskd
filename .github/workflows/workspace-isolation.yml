name: Workspace official runtime isolation

# Root runs only on a disposable GitHub-hosted VM. Never use self-hosted or
# pull_request_target. No repository credential survives checkout or sudo.
on:
  pull_request:
    paths:
      - "src/deskd/workspace/**"
      - "tests/test_workspace_linux_sandbox.py"
      - ".github/workflows/workspace-isolation.yml"
  push:
    branches: [main]
    paths:
      - "src/deskd/workspace/**"
      - "tests/test_workspace_linux_sandbox.py"
      - ".github/workflows/workspace-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  official-linux-isolation:
    # This kernel permits unprivileged user namespaces without changing a host
    # AppArmor policy or sysctl. Kernel incompatibility fails the test closed.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install test-only dependencies
        run: python -m pip install pytest "cryptography>=41"
      - name: Run pinned official daemon against a local model mock
        shell: bash
        run: |
          set -euo pipefail
          python_executable="$(python -c 'import sys; print(sys.executable)')"
          sudo env -i PATH=/usr/bin:/bin \
            PYTHONPATH="$GITHUB_WORKSPACE/src" \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            /usr/bin/unshare --mount --propagation private --fork \
            /bin/bash --noprofile --norc -s -- "$python_executable" "$GITHUB_WORKSPACE" <<'ROOT_SCRIPT'
          set -euo pipefail
          umask 077
          python_executable="$1"
          workspace="$2"
          isolation_root="$(mktemp -d /run/deskd-ws.XXXXXXXX)"
          chmod 0755 "$isolation_root"
          mkdir "$isolation_root/scratchpad"
          chmod 0755 "$isolation_root/scratchpad"
          export DESKD_SANDBOX_TEST_ROOT="$isolation_root/scratchpad"
          export TMPDIR="$DESKD_SANDBOX_TEST_ROOT"
          export HOME="$TMPDIR/root-home"
          mkdir "$HOME" "$TMPDIR/official" "$TMPDIR/system-tmp"
          chmod 0755 "$TMPDIR/official"
          chmod 1777 "$TMPDIR/system-tmp"
          # This bind exists only in this process's private mount namespace.
          # Stock daemon rendezvous and sandbox helper files stay in scratchpad.
          mount --bind "$TMPDIR/system-tmp" /tmp
          "$python_executable" - "$TMPDIR/official/codex" <<'FETCH_OFFICIAL'
          import base64
          import hashlib
          import io
          from pathlib import Path
          import sys
          import tarfile
          import urllib.request

          url = "https://registry.npmjs.org/@openai/codex/-/codex-0.160.0-linux-x64.tgz"
          expected = "KI/73OqGrHmR18s7ya7E1NqV6rT0y3lxr0s8S1qR2m6zU6QRF/HlR529jALLh5vjdUnsRT4Ahoxt0axb4kY99g=="
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = response.read(100 * 1024 * 1024)
              if response.read(1):
                  raise SystemExit("Official archive exceeds size limit")
          if base64.b64encode(hashlib.sha512(payload).digest()).decode() != expected:
              raise SystemExit("Official npm archive integrity mismatch")
          member_name = "package/vendor/x86_64-unknown-linux-musl/bin/codex"
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              member = archive.getmember(member_name)
              if not member.isfile() or member.size > 300 * 1024 * 1024:
                  raise SystemExit("Unexpected official executable member")
              data = archive.extractfile(member).read()
          if hashlib.sha256(data).hexdigest() != "12eb3e81114588aca3b7998f4f19e8997b056aca08e57a7ca7c8a3ec8c652aad":
              raise SystemExit("Official executable integrity mismatch")
          destination = Path(sys.argv[1])
          with destination.open("xb") as output:
              output.write(data)
          destination.chmod(0o755)
          print("Verified official Codex 0.160.0 Linux x64 artifact.")
          FETCH_OFFICIAL
          cd "$workspace"
          "$python_executable" -m pytest -o addopts='' -p no:cacheprovider \
            --basetemp="$TMPDIR/pytest" --junitxml="$TMPDIR/results.xml" \
            tests/test_workspace_linux_sandbox.py -q
          "$python_executable" - "$TMPDIR/results.xml" <<'VERIFY_EXECUTION'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          if not cases or any(case.find(tag) is not None for case in cases
                              for tag in ("skipped", "failure", "error")):
              raise SystemExit("Official sandbox acceptance requires executed passing tests and zero skips")
          print(f"Executed {len(cases)} official sandbox acceptance test(s); zero skipped.")
          VERIFY_EXECUTION
          ROOT_SCRIPT
