name: Git compatibility

on:
  push:
    branches: [main]
  pull_request:

# Without the branch filter above, a push to a PR branch triggers this
# twice -- once as `push`, once as `pull_request` -- and the two are not
# even the same test: `push` builds the branch tip, `pull_request` builds
# it merged into main. The merge result is the one worth gating on, so
# branches are covered by the PR event and `push` is left to keep main
# (and the README badge) honest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  git-2-54:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build pinned Git 2.54.0
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://www.kernel.org/pub/software/scm/git/git-2.54.0.tar.xz \
            --output /tmp/git-2.54.0.tar.xz
          echo 'f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3  /tmp/git-2.54.0.tar.xz' \
            | sha256sum --check
          tar -C /tmp -xf /tmp/git-2.54.0.tar.xz
          make -C /tmp/git-2.54.0 -j2 prefix=/tmp/git-2.54 \
            NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_PERL=YesPlease \
            NO_CURL=YesPlease install
          echo '/tmp/git-2.54/bin' >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[web]" pytest pytest-xdist httpx httpx2
      - name: Verify broker against Git 2.54
        run: |
          test "$(git --version)" = 'git version 2.54.0'
          python -m pytest -q tests/test_workspaces.py
