name: tests

# Plain pytest on every push and PR — no lint, no coverage gates. release.yml
# re-runs the suite before publishing; this exists so main always carries a
# fresh signal (and the README badge tells the truth).
#
# httpx/httpx2 are test-only: starlette's TestClient transports through
# httpx (older releases) or httpx2 (2026+ releases) depending on which
# starlette the fresh resolve picks; installing both keeps this green across
# the migration. The package deliberately depends on neither.

on:
  push:
    branches: [main]
  pull_request:

# Without the branch filter above, a push to a PR branch triggers this
# twice -- once as `push`, once as `pull_request` -- and the two are not
# even the same test: `push` builds the branch tip, `pull_request` builds
# it merged into main. The merge result is the one worth gating on, so
# branches are covered by the PR event and `push` is left to keep main
# (and the README badge) honest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[web,tui]" pytest pytest-xdist httpx httpx2
      - run: python -m pytest -q

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: deskd-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the non-root image, default service and authenticated API
        run: |
          set -euo pipefail
          test "$(docker image inspect deskd-ci:${GITHUB_SHA} --format '{{.Config.User}}')" = "deskd:deskd"
          expected="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/deskd/config.py)"
          test -n "${expected}"
          test "$(docker run --rm --entrypoint deskd deskd-ci:${GITHUB_SHA} --version)" = "deskd ${expected}"

          token='ci-reader-token-000000000000000000000001'
          token_hash="$(printf '%s' "${token}" | sha256sum | cut -d' ' -f1)"
          secret_dir="$(mktemp -d)"
          container="deskd-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            sudo rm -rf "${secret_dir}"
          }
          trap cleanup EXIT
          printf '{"version":1,"principals":[{"subject":"ci-reader","scopes":["read"],"token_sha256":"%s"}]}\n' \
            "${token_hash}" > "${secret_dir}/service-tokens.json"
          chmod 0600 "${secret_dir}/service-tokens.json"
          sudo chown 65532:65532 "${secret_dir}/service-tokens.json"

          docker run --detach --name "${container}" --init --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777 \
            --mount "type=bind,src=${secret_dir}/service-tokens.json,dst=/run/secrets/service-tokens.json,readonly" \
            --env DESKD_SERVICE_TOKENS_FILE=/run/secrets/service-tokens.json \
            --publish 127.0.0.1::8000 \
            "deskd-ci:${GITHUB_SHA}"
          port="$(docker port "${container}" 8000/tcp | sed -n 's/.*://p')"
          test -n "${port}"
          healthy=0
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error \
                "http://127.0.0.1:${port}/healthz" >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "${healthy}" -ne 1 ]; then
            docker logs "${container}"
            exit 1
          fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:${port}/api/snapshot")" = 401
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${token}" \
            "http://127.0.0.1:${port}/api/snapshot" \
            | python -c 'import json,sys; value=json.load(sys.stdin); assert value["server_version"]; assert "cursor" in value and "meta" in value'
