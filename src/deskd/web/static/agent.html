<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent · deskd console</title>
<link rel="stylesheet" href="/static/deskd.css">
<script src="/static/shell.js"></script>
</head>
<body>
<main class="wrap">
  <div class="pagehead">
    <div><h1 id="title">…</h1><div class="sub" id="subtitle"></div></div>
  </div>
  <nav class="subnav">
    <a href="#profile">Profile</a><a href="#session">Session</a><a href="#wakes-me">What wakes it</a>
    <a href="#meetings">Meetings</a><a href="#inbox">Inbox</a><a href="#tasks">Tasks</a>
    <a href="#wake-history">Wake history</a><a href="#delivery">Delivery</a><a href="#hooks">Hooks</a><a href="#events">Events</a>
  </nav>
  <div id="body"><div class="loading">Loading…</div></div>
</main>
<footer class="foot" id="foot"></footer>
<script>
"use strict";
var S = Shell, esc = S.esc, rel = S.rel, ago = S.ago;
S.init("board", "Agent");

// The page is served at /agent/<role>; the role is the last path segment.
function role() { return decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || ""); }

function card(id, title, inner) {
  return '<div class="card" id="' + id + '"><div class="card-head"><h2>' + esc(title) + "</h2>"
    + '<a class="quiet" href="#top">top ↑</a></div>' + inner + "</div>";
}
function tbl(head, rows, emptyHtml) {
  if (!rows.length) return emptyHtml;
  return '<div class="tblwrap"><table><thead><tr>' + head.map(function (h) {
    return "<th>" + esc(h) + "</th>";
  }).join("") + "</tr></thead><tbody>" + rows.join("") + "</tbody></table></div>";
}

function profileCard(d) {
  var p = d.profile || {};
  var caps = (p.capabilities || []).map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("");
  // `authority` is an opaque host-defined dict: display, never interpret.
  var auth = Object.entries(p.authority || {}).map(function (kv) {
    return '<span class="kvchip"><em>' + esc(S.human(kv[0])) + "</em>" + esc(kv[1]) + "</span>";
  }).join(" ");
  return card("profile", "Profile & authority",
    '<div class="kv"><span class="k">Role</span><span class="v">' + esc(d.role) + "</span>"
    + '<span class="k">Capabilities</span><span class="v"><span class="chips">' + (caps || "—") + "</span></span>"
    + '<span class="k">Authority</span><span class="v">' + (auth || "—") + "</span></div>");
}
function sessionCard(d) {
  var p = d.presence || {}, live = p.liveness === "online" || p.liveness === "suspect";
  var now;
  if (live) {
    var ip = [];
    (d.session_todos && Array.isArray(d.session_todos.snapshot) ? d.session_todos.snapshot : []).forEach(function (x) {
      if (String(x.status || "").toLowerCase() === "in_progress") ip.push(x.content || x.activeForm || "");
    });
    now = ip.length ? ip.map(function (c) { return '<div class="now-item">' + esc(c) + "</div>"; }).join("")
      : (p.activity ? '<div class="now-item">' + esc(p.activity) + "</div>" : '<span class="quiet">Idle</span>');
  } else {
    now = '<span class="quiet">Session ended / standing by</span>'
      + (p.activity ? '<div class="meta">Last report: ' + esc(p.activity) + "</div>" : "");
  }
  return card("session", "Current session",
    '<div class="kv"><span class="k">Liveness</span><span class="v"><span class="dot ' + esc(p.liveness) + '"></span> '
    + esc(S.human(p.liveness)) + (p.heartbeat_age_seconds != null ? " · heartbeat " + ago(p.heartbeat_age_seconds) + " ago" : "") + "</span>"
    + '<span class="k">Phase</span><span class="v">' + esc(S.human(p.phase || "—")) + (p.stale_day ? ' <span class="badge warn">stale session, rollover due</span>' : "") + "</span>"
    + '<span class="k">Session day</span><span class="v">' + esc(p.session_day || "—") + "</span>"
    + '<span class="k">Session</span><span class="v">' + esc(p.session_id || "—") + (p.harness ? " · " + esc(p.harness) : "") + "</span>"
    + '<span class="k">Start / end</span><span class="v">' + rel(p.started_at) + " → " + (p.ended_at ? rel(p.ended_at) : "in progress") + "</span></div>"
    + '<div class="nowbox" style="margin-top:10px">' + now + "</div>");
}
// "What can wake this agent" — the engine's own answer (wake_sources), so the
// panel and the wake path can never disagree about what is armed.
function wakesMeCard(w) {
  if (!w) return card("wakes-me", "What can wake this agent",
    S.empty("Wake sources unavailable for this role."));
  var rows = [];
  (w.self_hooks || []).forEach(function (h) {
    rows.push(["hook #" + h.id + " (" + S.human(h.kind) + ")", esc(h.title),
      h.next_fire_at ? "next " + rel(h.next_fire_at) : "—"]);
  });
  (w.meeting_wakes || []).forEach(function (m) {
    rows.push(["meeting wake", esc(m.agenda), "requested " + rel(m.created_at)]);
  });
  (w.urgent_tasks || []).forEach(function (t) {
    rows.push(["urgent task #" + t.id, esc(t.title), t.due_at ? "due " + rel(t.due_at) : "—"]);
  });
  (w.inbox_queued || []).forEach(function (i) {
    rows.push(["inbox (queued)", esc(i.title), "enqueued " + rel(i.enqueued_at)]);
  });
  (w.actionable_tasks || []).forEach(function (t) {
    rows.push(["idle-queue task #" + t.id, esc(t.title), "wakes it whenever idle"]);
  });
  var body = rows.length
    ? '<div class="tblwrap"><table><thead><tr><th>Source</th><th>What</th><th>When</th></tr></thead><tbody>'
      + rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>"; }).join("")
      + "</tbody></table></div>"
    : S.empty("Nothing is currently armed to wake this agent.", w.manage || "");
  var stalled = (w.stalled_tasks || []).length
    ? '<div class="section"><h3>Stalled — no longer waking anyone</h3><div class="chips">'
      + w.stalled_tasks.map(function (t) { return '<a class="chip bad" href="/tasks?role=' + encodeURIComponent(w.role) + '">#' + t.id + " " + esc(t.title) + "</a>"; }).join("")
      + '</div><div class="quiet" style="margin-top:5px">Woken for these repeatedly without movement; now somebody’s decision (see <a href="/tasks">Tasks</a>).</div></div>'
    : "";
  var pending = (w.pending_wake_attempts || []).length
    ? '<div class="section"><h3>In-flight wake attempts</h3><div class="chips">'
      + w.pending_wake_attempts.map(function (a) {
        return '<a class="chip warn" href="/wake">' + esc(S.human(a.reason_kind)) + " · L" + a.level + "</a>";
      }).join("") + "</div></div>"
    : "";
  return card("wakes-me", "What can wake this agent", body + pending + stalled);
}
function meetingCard(d) {
  var m = d.meeting || {};
  var mtgs = (m.active_meetings || []).map(function (x) { return '<a href="/meetings">' + esc(x.agenda) + "</a>"; }).join(", ") || "none";
  return card("meetings", "Meetings",
    '<div class="chips"><a class="chip ' + (m.pending_wakes ? "bad" : "") + '" href="/meetings">pending wakes <b>' + (m.pending_wakes || 0) + "</b></a>"
    + '<a class="chip ' + (m.unread_messages ? "warn" : "") + '" href="/meetings">unread <b>' + (m.unread_messages || 0) + "</b></a>"
    + '<a class="chip ' + ((m.response_obligations || {}).pending ? "warn" : "") + '" href="/meetings">response owed <b>' + ((m.response_obligations || {}).pending || 0) + "</b></a></div>"
    + '<div class="kv" style="margin-top:8px"><span class="k">Attending</span><span class="v">' + mtgs + "</span></div>");
}
function inboxCard(d) {
  var rows = (d.inbox || []).map(function (i) {
    var st = i.acked_at ? S.stateBadge("acked") : i.delivered_at ? S.stateBadge("delivered") : S.stateBadge("queued");
    return "<tr><td>" + st + "</td><td>" + esc(S.human(i.source_kind))
      + (i.priority === "urgent" ? ' <span class="badge bad">urgent</span>' : "") + "</td><td>" + esc(i.title)
      + (i.ref && i.ref !== "*" ? ' <span class="badge">' + esc(i.ref) + "</span>" : "") + "</td><td>" + rel(i.enqueued_at) + "</td></tr>";
  });
  return card("inbox", "Inbox · latest 100",
    tbl(["State", "Source", "Item", "Enqueued"], rows,
        S.empty("Inbox empty — notifications for this agent land here.")));
}
function tasksCard(d) {
  var c = d.task_counts || {};
  var head = '<div class="chips" style="margin-bottom:8px">'
    + '<span class="chip">pending <b>' + (c.pending || 0) + "</b></span>"
    + '<span class="chip warn">in progress <b>' + (c.in_progress || 0) + "</b></span>"
    + '<span class="chip ' + (c.blocked ? "bad" : "") + '">blocked <b>' + (c.blocked || 0) + "</b></span>"
    + '<span class="chip ok">done <b>' + (c.done || 0) + "</b></span>"
    + '<span class="chip">cancelled <b>' + (c.cancelled || 0) + "</b></span></div>";
  var rows = (d.tasks || []).map(function (t) {
    return "<tr><td>#" + t.id + "</td><td>" + S.stateBadge(t.status)
      + (t.overdue ? ' <span class="badge bad">overdue</span>' : "") + "</td><td>" + esc(t.priority) + "</td><td>" + esc(t.title)
      + (t.blocked_on ? '<div class="quiet">blocked on: ' + esc(t.blocked_on) + "</div>" : "")
      + (t.result_note ? '<div class="quiet">' + esc(t.result_note) + "</div>" : "") + "</td><td>"
      + esc(S.human(t.source_kind)) + (t.source_ref ? " · " + esc(t.source_ref) : "") + "</td><td>created " + rel(t.created_at)
      + "<br>updated " + rel(t.updated_at) + "</td></tr>";
  });
  return card("tasks", "Tasks · full history",
    head + tbl(["id", "State", "Priority", "Title / notes", "Source", "Time"], rows,
      S.empty("No tasks for this role yet.", "deskd task add --for " + role() + " --title \"…\"")));
}
function wakeCard(d) {
  var rows = (d.wake_history || []).map(function (w) {
    return "<tr><td>" + esc(S.human(w.reason_kind)) + "</td><td>" + esc(S.human(w.channel)) + " L" + w.level + "</td><td>"
      + S.stateBadge(w.outcome) + "</td><td class=\"num\">" + (w.latency_seconds != null ? S.dur(w.latency_seconds) : "—")
      + "</td><td>" + esc(w.source_ref || "") + "</td><td>" + rel(w.attempted_at) + "</td></tr>";
  });
  return card("wake-history", "Wake history · latest 80",
    tbl(["Reason", "Rung", "Outcome", "Latency", "Source", "Time"], rows,
      S.empty("Never woken by the orchestrator — attempts will appear here.")));
}
function deliveryCard(d) {
  var rows = (d.delivery || []).map(function (x) {
    return "<tr><td>#" + x.message_id + "</td><td>" + S.stateBadge(x.state) + "</td><td>" + esc(x.thread_id)
      + "</td><td>queued " + rel(x.queued_at) + "</td><td>"
      + (x.read_at ? "read " + rel(x.read_at) : (x.notified_at ? "notified " + rel(x.notified_at) : "—")) + "</td></tr>";
  });
  return card("delivery", "Message delivery ledger · latest 80",
    tbl(["msg", "State", "Thread", "Queued", "Read / notified"], rows,
      S.empty("No meeting messages addressed to this agent yet.")));
}
function hookSpec(h) {
  var sp = h.spec || {};
  if (h.kind === "probe") return esc(sp.callable || "") + " · every " + S.dur(sp.every);
  if (h.kind === "interval") return "every " + S.dur(sp.every);
  if (h.kind === "cron") return esc(sp.cron || "") + (sp.tz ? " (" + esc(sp.tz) + ")" : "");
  return sp.at ? "at " + rel(sp.at) : "—";
}
function hooksCard(d) {
  var rows = (d.hooks || []).map(function (h) {
    return "<tr><td>#" + h.id + "</td><td>" + esc(S.human(h.kind)) + "</td><td>" + esc(h.title) + "</td><td>" + hookSpec(h)
      + "</td><td>" + S.stateBadge(h.status)
      + (h.last_error ? ' <span class="badge bad" title="' + esc(h.last_error) + '">error ×' + (h.error_streak || 1) + "</span>" : "")
      + "</td><td>" + (h.next_fire_at ? rel(h.next_fire_at) : "—") + " · fired ×" + h.fire_count + "</td></tr>";
  });
  return card("hooks", "Wake hooks · all statuses",
    tbl(["id", "Kind", "Title", "Spec", "Status", "Next / fires"], rows,
      S.empty("No hooks for this role.", "deskd hook add --for " + role() + " --title \"…\" (--at ISO | --every SECONDS)")));
}
function eventsCard(d) {
  var rows = (d.events || []).map(function (e) {
    return '<div class="evline"><b>' + esc(e.actor) + "</b> · " + esc(S.human(e.kind))
      + (e.ref ? " · " + esc(e.ref) : "") + S.payloadChips(e.payload) + " · " + rel(e.created_at) + "</div>";
  }).join("");
  return card("events", "Orchestration events · latest 100",
    rows || S.empty("No events mention this agent yet."));
}

// What the session has been SAYING this turn, oldest first. `thinking` rows
// carry no text by design — the harness emits the fact and redacts the content
// (docs/session-feed.md) — so they render as a marker. Printing an empty body
// under a "thinking" heading would read as a message that failed to load.
function feedCard(f) {
  if (!f) return "";
  if (!f.session_id) return card("feed", "Narration", S.empty("No live session."));
  var lines = (f.lines || []).map(function (l) {
    var t = new Date(l.at).toLocaleTimeString();
    if (l.kind === "thinking") {
      return '<div class="feed-line"><span class="quiet">' + esc(t) + " · thinking…</span></div>";
    }
    return '<div class="feed-line"><span class="quiet">' + esc(t) + "</span> " + esc(l.text) + "</div>";
  }).join("");
  return card("feed", "Narration · " + (f.lines || []).length + " line(s)",
    lines || S.empty("Nothing said yet this turn."));
}

async function load() {
  var r = role();
  if (!r) { S.setHTML(S.$("#body"), S.empty("No role in the URL.")); return; }
  var d = await S.api("/api/agent/" + encodeURIComponent(r));
  var w = null, f = null;
  try { w = await S.api("/api/agent/" + encodeURIComponent(r) + "/wake-sources"); } catch (e) { /* panel degrades */ }
  try { f = await S.api("/api/agent/" + encodeURIComponent(r) + "/feed?limit=40"); } catch (e) { /* panel degrades */ }
  var p = d.presence || {};
  var name = (d.profile && d.profile.display_name) || d.role;
  S.setHTML(S.$("#title"), '<span class="dot ' + esc(p.liveness) + '"></span> ' + esc(name));
  S.setHTML(S.$("#subtitle"),
    '<span class="chips"><span class="chip">' + esc(S.human(p.liveness)) + "</span>"
    + '<span class="chip">' + esc(S.human(p.phase || "—")) + "</span>"
    + (p.session_day ? '<span class="chip">' + esc(p.session_day) + "</span>" : "") + "</span>");
  document.title = name + " · Agent · console";
  S.setHTML(S.$("#body"),
    profileCard(d) + sessionCard(d) + feedCard(f) + wakesMeCard(w) + meetingCard(d)
    + inboxCard(d) + tasksCard(d) + wakeCard(d) + deliveryCard(d) + hooksCard(d) + eventsCard(d));
  S.$("#foot").textContent = "updated " + new Date(d.generated_at).toLocaleTimeString();
}
S.autorefresh(load, 5);
</script>
</body>
</html>
