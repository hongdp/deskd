<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board · deskd console</title>
<link rel="stylesheet" href="/static/deskd.css">
<script src="/static/shell.js"></script>
</head>
<body>
<main class="wrap">
  <div class="pagehead">
    <div><h1>Agent board</h1><div class="sub">Live state and queued work for every agent — every number links to the view that explains it</div></div>
  </div>
  <div class="alarms" id="alarms"></div>
  <div class="tiles" id="tiles"></div>
  <div class="grid" id="grid"><div class="loading">Loading…</div></div>
  <div class="card"><div class="card-head"><h3>Wake hooks · all agents</h3><a class="quiet" href="/tasks#hooks">all statuses →</a></div><div id="hooks"><div class="loading">Loading…</div></div></div>
  <div class="card"><div class="card-head"><h3>Wake orchestration · last 12 attempts</h3><a class="quiet" href="/wake">full ladder &amp; history →</a></div><div id="wake"></div></div>
  <div class="card"><div class="card-head"><h3>Orchestration event stream</h3><span class="quiet">last 20</span></div><div id="events"></div></div>
</main>
<footer class="foot" id="foot"></footer>
<script>
"use strict";
var S = Shell, esc = S.esc, rel = S.rel, ago = S.ago;
S.init("board", "Board");

function livenessText(a) {
  var s = { online: "online", suspect: "suspect", dead: "presumed offline",
            offline: "session ended", never: "never seen" }[a.liveness] || a.liveness;
  var age = a.heartbeat_age_seconds != null ? " · heartbeat " + ago(a.heartbeat_age_seconds) + " ago" : "";
  var life = a.phase === "draining" ? ' · <span style="color:var(--warn)">handing off</span>'
    : a.stale_day ? ' · <span style="color:var(--warn)">stale session, rollover due</span>'
    // nowrap: a date's hyphens are line-break opportunities, and "2026-07-/26"
    // split across lines reads like a rendering bug.
    : (a.session_day ? ' · <span style="white-space:nowrap">' + esc(a.session_day) + "</span>" : "");
  return s + age + life;
}

// --- KPI tiles: labeled, colored by severity, each one a LINK ----------------
function tile(href, label, value, cls, note) {
  return '<a class="tile ' + (cls || "") + '" href="' + href + '">'
    + '<div class="label">' + esc(label) + '</div>'
    + '<div class="value">' + value + '</div>'
    + (note ? '<div class="note">' + note + '</div>' : "") + '</a>';
}
function renderTiles(h) {
  var oldest = h.oldest_unread_age_seconds;
  S.setHTML(S.$("#tiles"),
    tile("/tasks", "Open tasks", h.total_open_tasks || 0, "", "all roles")
    + tile("/tasks", "Overdue", h.total_overdue || 0, h.total_overdue ? "bad" : "ok", "past soft deadline")
    + tile("/meetings", "Unread deliveries", h.unread_deliveries || 0, h.unread_deliveries ? "warn" : "ok", "meeting messages")
    + tile("/meetings", "Stuck deliveries", h.stuck_deliveries || 0, h.stuck_deliveries ? "bad" : "ok", "past SLA, not escalated")
    + tile("/wake", "Pending wakes", h.pending_wakes || 0, "", "ladder climbing")
    + tile("/wake", "At human level", h.wakes_at_human_level || 0, h.wakes_at_human_level ? "bad" : "ok", "a person is being pulled in")
    + tile("/wake", "Inbox queued", h.inbox_queued || 0, "", "awaiting delivery")
    + tile("/escalations", "Unsent escalations", h.unsent_escalations || 0, h.unsent_escalations ? "warn" : "ok", "meeting escalations")
    + tile("/meetings", "Oldest unread", oldest != null ? ago(oldest) : "none", oldest != null && oldest > 300 ? "warn" : "ok", "age of oldest unread"));
}

// --- alarm row: the engine's loudest reds, ALWAYS visible ---------------------
function alarm(href, ok, text, count) {
  var cls = ok ? "" : "bad";
  return '<a class="alarm ' + cls + '" href="' + href + '"><span class="st"></span>'
    + text + (count != null ? " <b>" + count + "</b>" : "") + "</a>";
}
function renderAlarms(h) {
  var chans = (h.channels || []).filter(function (c) { return !c.outbox; });
  var avail = chans.filter(function (c) { return c.available; }).length;
  S.setHTML(S.$("#alarms"),
    alarm("/escalations", !h.human_rung_unwired,
      h.human_rung_unwired ? "human rung UNWIRED — escalations stop at the outbox" : "human rung wired")
    + alarm("/escalations", !h.undelivered_escalations, "undelivered escalations", h.undelivered_escalations || 0)
    + alarm("/escalations", !h.unroutable_demands, "unroutable demands", h.unroutable_demands || 0)
    + alarm("/tasks", !h.stalled_tasks, "stalled tasks", h.stalled_tasks || 0)
    + alarm("/tasks", !h.blocked_unspecified, "blocked without a named dependency", h.blocked_unspecified || 0)
    + alarm("/escalations", avail > 0 || chans.length === 0,
      "channels available <b>" + avail + "</b> of " + chans.length));
}

// --- agent cards ---------------------------------------------------------------
function dueLabel(t) {
  if (!t.due_at) return "";
  var sec = (new Date(t.due_at) - Date.now()) / 1000;
  if (t.overdue || sec < 0) return '<span class="badge bad">' + ago(sec) + " overdue</span>";
  return '<span class="badge warn">due in ' + ago(sec) + "</span>";
}
function taskHtml(t) {
  var cls = "task" + (t.overdue ? " overdue" : t.priority === "urgent" ? " urgent" : "");
  var pri = t.priority === "urgent" ? '<span class="badge bad">urgent</span>'
    : t.priority === "low" ? '<span class="badge">low</span>' : "";
  var src = '<span class="badge info">' + esc(S.human(t.source_kind)) + (t.source_ref ? " · " + esc(t.source_ref) : "") + "</span>";
  var st = t.status !== "pending" ? S.stateBadge(t.status) : "";
  return '<div class="' + cls + '"><div class="t-top"><span class="title">' + esc(t.title) + "</span></div>"
    + '<div class="t-meta">' + dueLabel(t) + pri + st + src + "</div>"
    + (t.detail ? '<div class="detail">' + esc(t.detail) + "</div>" : "") + "</div>";
}
function inboxRow(i, delivered) {
  var cls = "task" + (i.priority === "urgent" ? " urgent" : "");
  var pri = i.priority === "urgent" ? '<span class="badge bad">urgent</span>' : "";
  var src = '<span class="badge info">' + esc(S.human(i.source_kind)) + (i.ref && i.ref !== "*" ? " · " + esc(i.ref) : "") + "</span>";
  var st = delivered ? '<span class="badge">delivered · awaiting ack</span>' : '<span class="badge warn">queued</span>';
  return '<div class="' + cls + '"' + (delivered ? ' style="opacity:.6"' : "") + '><div class="t-top"><span class="title">' + esc(i.title) + "</span></div>"
    + '<div class="t-meta">' + pri + st + src + "<span>" + rel(i.enqueued_at) + "</span></div></div>";
}
function inboxHtml(ib) {
  if (!ib || (!ib.queued_count && !ib.delivered_count))
    return S.empty("Inbox empty — notifications land here and wake the agent.");
  return '<div class="tasks">' + ib.queued.map(function (i) { return inboxRow(i, false); }).join("")
    + ib.delivered.map(function (i) { return inboxRow(i, true); }).join("") + "</div>";
}
function hookNext(h) {
  if (!h.next_fire_at) return "—";
  var msec = new Date(h.next_fire_at) - Date.now();
  return msec > 0 ? "in " + ago(msec / 1000) : "due";
}
function hookLine(h, withOwner) {
  var err = h.last_error ? ' · <span style="color:var(--warn)">last run errored</span>' : "";
  var own = withOwner ? "<b>" + esc(h.owner_role) + "</b> · " : "";
  return '<div class="evline">' + own + "#" + h.id + " <b>" + esc(S.human(h.kind)) + "</b> · " + esc(h.title)
    + (h.priority === "urgent" ? ' <span class="badge bad">urgent</span>' : "")
    + " · next " + esc(hookNext(h)) + " · fired ×" + h.fire_count + err + "</div>";
}
function hooksHtml(hs) {
  var body = (hs && hs.length) ? hs.map(function (h) { return hookLine(h, false); }).join("")
    : S.empty("No hooks yet.", "deskd hook add --for ROLE --title \"…\" (--at ISO | --every SECONDS | --probe fn)");
  return '<div class="section"><h3>Wake hooks' + (hs && hs.length ? " · " + hs.length : "") + "</h3>" + body + "</div>";
}
function meetingHtml(m, role) {
  if (!m) return S.empty("No meeting obligations.");
  var wake = m.pending_wakes || 0, unread = m.unread_messages || 0, ob = (m.response_obligations || {}).pending || 0;
  var chips = '<a class="chip ' + (wake ? "bad" : "") + '" href="/meetings">pending wakes <b>' + wake + "</b></a>"
    + '<a class="chip ' + (unread ? "warn" : "") + '" href="/meetings">unread <b>' + unread + "</b></a>"
    + '<a class="chip ' + (ob ? "warn" : "") + '" href="/meetings">response owed <b>' + ob + "</b></a>";
  var mtgs = (m.active_meetings || []).map(function (x) { return '<a href="/meetings">' + esc(x.agenda) + "</a>"; }).join(", ");
  return '<div class="chips">' + chips + "</div>"
    + (mtgs ? '<div class="quiet" style="margin-top:6px">In: ' + mtgs + "</div>"
            : '<div class="quiet" style="margin-top:6px">No meetings in progress</div>');
}
function wakeChip(w) {
  if (!w || !w.pending) return "";
  var lvl = w.max_level == null ? "" : " L" + w.max_level;
  var cls = w.max_level >= 3 ? "bad" : w.max_level >= 1 ? "warn" : "";
  return '<a class="chip ' + cls + '" href="/wake">waking' + lvl + " <b>" + w.pending + "</b></a>";
}
function todoSplit(td) {
  var out = { inprog: [], pending: [], done: [] };
  if (td && Array.isArray(td.snapshot)) td.snapshot.forEach(function (x) {
    var s = String((x && (x.status || x.state)) || "").toLowerCase();
    var c = (x && (x.content || x.activeForm || x.title || x.text)) || (typeof x === "string" ? x : "");
    if (!c) return;
    if (s === "in_progress" || s === "active" || s === "doing") out.inprog.push(c);
    else if (s === "completed" || s === "done") out.done.push(c);
    else out.pending.push(c);
  });
  return out;
}
function isLive(a) { return a.liveness === "online" || a.liveness === "suspect"; }
function nowHtml(a) {
  if (!isLive(a)) {
    var last = a.activity ? '<div class="meta">Last report: ' + esc(a.activity) + "</div>" : "";
    return '<div class="section"><h3>Now executing</h3><div class="nowbox"><span class="quiet">Session ended / standing by</span>' + last + "</div></div>";
  }
  var t = todoSplit(a.session_todos);
  var body = t.inprog.length
    ? t.inprog.map(function (c) { return '<div class="now-item">' + esc(c) + "</div>"; }).join("")
    : (a.activity ? '<div class="now-item">' + esc(a.activity) + "</div>" : '<span class="quiet">Idle / standing by</span>');
  // The live tool trace: what the session touched in the last two minutes.
  // The engine hides it once stale, so rendering it is always honest.
  if (a.last_tool) {
    body += '<div class="meta">⚙ ' + esc(a.last_tool) +
      (a.last_tool_age_seconds != null ? " · " + a.last_tool_age_seconds + "s ago" : "") +
      "</div>";
  }
  var meta = '<div class="meta">' + esc(a.state || "—") + (a.harness ? " · " + esc(a.harness) : "")
    + (a.started_at ? " · started " + rel(a.started_at) : "")
    + (a.session_todos && a.session_todos.updated_at ? " · todo " + rel(a.session_todos.updated_at) : "") + "</div>";
  return '<div class="section"><h3>Now executing</h3><div class="nowbox">' + body + meta + "</div></div>";
}
function queueSummaryHtml(a) {
  var t = isLive(a) ? todoSplit(a.session_todos) : { inprog: [], pending: [], done: [] };
  var ib = (a.inbox && a.inbox.queued_count) || 0, pend = (a.task_counts && a.task_counts.pending) || 0,
      hk = (a.hooks && a.hooks.length) || 0;
  var next = hk ? a.hooks.map(function (h) { return h.next_fire_at; }).filter(Boolean).sort()[0] : null;
  var nx = next && (new Date(next) - Date.now() > 0) ? " · next in " + ago((new Date(next) - Date.now()) / 1000) : "";
  // When a queued inbox wakes somebody. Without it a batching seat and a stuck
  // one are the same picture: "idle" beside a non-empty inbox, for minutes.
  // The instant comes from the engine (inbox.wake_due_at), which is the same
  // call the wake planner decides on — a countdown computed here from a window
  // this page happened to know would drift from the thing it counts down to.
  var due = a.inbox && a.inbox.wake_due_at, wk = "";
  if (ib && due) {
    var left = (new Date(due) - Date.now()) / 1000;
    wk = left > 0 ? " · waking in " + ago(left) : " · wake due";
  }
  return '<div class="qsum"><span><b>Queue</b></span><span>inbox <b>' + ib + "</b>" + wk + "</span><span>open tasks <b>" + pend
    + "</b></span><span>next steps <b>" + t.pending.length + "</b></span><span>hooks <b>" + hk + "</b>" + nx + "</span></div>";
}
function workBreakdownHtml(a) {
  if (!isLive(a)) return "";
  var t = todoSplit(a.session_todos);
  if (!t.inprog.length && !t.pending.length && !t.done.length) return "";
  function li(arr, cls) { return arr.map(function (c) { return '<li class="' + cls + '">' + esc(c) + "</li>"; }).join(""); }
  return '<div class="section"><details class="todos"><summary>Work breakdown (in progress ' + t.inprog.length
    + " / pending " + t.pending.length + " / done " + t.done.length + ")</summary><ul class=\"wbreak\">"
    + li(t.inprog, "ip") + li(t.pending, "") + li(t.done, "dn") + "</ul></details></div>";
}
function cardHtml(a) {
  var tasks = a.tasks && a.tasks.length ? '<div class="tasks">' + a.tasks.map(taskHtml).join("") + "</div>"
    : S.empty("No open tasks.", "deskd task add --for " + a.role + " --title \"…\"");
  var c = a.task_counts || {};
  var counts = '<div class="chips" style="margin-top:8px">'
    + '<a class="chip" href="/tasks?role=' + encodeURIComponent(a.role) + '">pending <b>' + (c.pending || 0) + "</b></a>"
    + '<a class="chip" href="/tasks?role=' + encodeURIComponent(a.role) + '">in progress <b>' + (c.in_progress || 0) + "</b></a>"
    + '<a class="chip' + (c.blocked ? " bad" : "") + '" href="/tasks?role=' + encodeURIComponent(a.role) + '">blocked <b>' + (c.blocked || 0) + "</b></a>"
    + '<a class="chip" href="/tasks?role=' + encodeURIComponent(a.role) + '">done <b>' + (c.done || 0) + "</b></a></div>";
  var url = "/agent/" + encodeURIComponent(a.role);
  return '<div class="card">'
    + '<div class="chead"><span class="dot ' + esc(a.liveness) + '"></span>'
    + '<h2><a href="' + url + '">' + esc(a.display_name || a.role) + "</a> "
    + '<a href="' + url + '" style="font-size:12px;font-weight:400">details →</a></h2>'
    + '<span class="liveness">' + livenessText(a) + "</span></div>"
    + nowHtml(a)
    + queueSummaryHtml(a)
    + '<div class="section"><h3>Inbox' + (a.inbox && a.inbox.urgent_queued ? ' · <span style="color:var(--bad)">' + a.inbox.urgent_queued + " urgent</span>"
      : (a.inbox && a.inbox.queued_count ? " · " + a.inbox.queued_count + " queued" : "")) + "</h3>" + inboxHtml(a.inbox) + "</div>"
    + '<div class="section"><h3>Meeting obligations &amp; wakes</h3>' + meetingHtml(a.meeting, a.role)
    + (wakeChip(a.wake) ? '<div class="chips" style="margin-top:6px">' + wakeChip(a.wake) + "</div>" : "") + "</div>"
    + hooksHtml(a.hooks)
    + '<div class="section"><h3>Tasks' + (a.overdue_count ? ' · <span style="color:var(--bad)">' + a.overdue_count + " overdue</span>" : "") + "</h3>" + tasks + counts + "</div>"
    + workBreakdownHtml(a)
    + "</div>";
}

function renderHooks(agents) {
  var all = [];
  (agents || []).forEach(function (a) { (a.hooks || []).forEach(function (h) { all.push(Object.assign({ owner_role: a.role }, h)); }); });
  S.setHTML(S.$("#hooks"), all.length ? all.map(function (h) { return hookLine(h, true); }).join("")
    : S.empty("No hooks registered — agents schedule their own wakes here.",
      "deskd hook add --for ROLE --title \"…\" (--at ISO | --every SECONDS | --probe module.path:fn)"));
}
function renderWake(ws) {
  S.setHTML(S.$("#wake"), (ws && ws.length) ? ws.map(function (w) {
    var oc = w.outcome === "pending"
      ? '<span style="color:' + (w.level >= 3 ? "var(--bad)" : "var(--warn)") + '">in progress</span>'
      : (w.outcome === "acked" || w.outcome === "read")
        ? '<span style="color:var(--ok)">delivered' + (w.latency_seconds != null ? " in " + S.dur(w.latency_seconds) : "") + "</span>"
        : esc(S.human(w.outcome));
    return '<div class="evline"><b>' + esc(w.role) + "</b> · " + esc(S.human(w.reason_kind)) + " · "
      + esc(S.human(w.channel)) + " L" + w.level + " · " + oc + " · " + rel(w.attempted_at) + "</div>";
  }).join("") : S.empty("No wake attempts yet — the orchestrator records every rung it climbs here."));
}
function renderEvents(evs) {
  S.setHTML(S.$("#events"), (evs && evs.length) ? evs.map(function (e) {
    return '<div class="evline"><b>' + esc(e.actor) + "</b> · " + esc(S.human(e.kind))
      + (e.ref ? " · " + esc(e.ref) : "") + S.payloadChips(e.payload) + " · " + rel(e.created_at) + "</div>";
  }).join("") : S.empty("No events yet — every orchestration action lands in this stream."));
}

async function load() {
  var b = await S.api("/api/board");
  renderAlarms(b.health);
  renderTiles(b.health);
  S.setHTML(S.$("#grid"), b.agents.length ? b.agents.map(cardHtml).join("")
    : S.empty("No agents registered yet — the host seeds roles via configure(roles=…).") );
  renderHooks(b.agents);
  renderWake(b.wake_activity);
  renderEvents(b.recent_events);
  S.$("#foot").textContent = "updated " + new Date(b.generated_at).toLocaleTimeString();
}
S.autorefresh(load, 5);
</script>
</body>
</html>
